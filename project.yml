name: QuizApp
options:
    bundleIdPrefix: my
    deploymentTarget:
    iOS: "26.0"
    macOS: "14.0"
    visionOS: "1.0"
configs:
    Debug: debug
    Debug-Mock: debug
    Release: release
packages:
    SUICoordinator:
        url: https://github.com/felilo/SUICoordinator
        from: 1.0.0
    Firebase:
        url: https://github.com/firebase/firebase-ios-sdk
        from: 12.10.0
    GoogleSignIn:
        url: https://github.com/google/GoogleSignIn-iOS
        from: 8.0.0
targets:
    QuizApp-iOS:
        type: application
        platform: iOS
        deploymentTarget: "26.0"
        sources:
          - path: QuizApp/iOS
          - path: QuizApp/Shared
          - path: QuizApp/Swiftgen+Generated
            createIntermediateGroups: true
        resources:
          - path: QuizApp/Shared/Resources
        dependencies:
            - package: SUICoordinator
            - package: Firebase
              products:
                - FirebaseCore
                - FirebaseAuth
            - package: GoogleSignIn
              products:
                - GoogleSignIn
                - GoogleSignInSwift
        preBuildScripts:
          - name: "Run Swiftgen script"
            script: |
              echo "Running a Swiftgen script!"
              if which swiftgen >/dev/null; then
                swiftgen
              else
                echo "warning: SwiftGen not found. Install with Homebrew or ensure it's in your PATH."
              fi
            basedOnDependencyAnalysis: false # Optional: Set to true if the script depends on build analysis
            showEnvVars: false # Optional: Set to true to show environment variables in the script's output
          - name: "Run SwiftLint script"
            script: |
                echo "Running a SwiftLint script!"
                if command -v swiftlint >/dev/null 2>&1; then
                    swiftlint
                else
                    echo "warning: swiftlint command not found - See https://github.com/realm/SwiftLint#installation for installation instructions."
                fi
            basedOnDependencyAnalysis: false # Optional: Set to true if the script depends on build analysis
            showEnvVars: false # Optional: Set to true to show environment variables in the script's output
        postBuildScripts:
          - name: "Run Firebase plist file script"
            script: |
              if [ "${CONFIGURATION}" == "Debug-Mock" ]; then
                echo "Skipping Firebase plist (MOCK_DATA)"
                exit 0
              fi
              echo "Running a Firebase plist script"
              PLIST_DEST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/GoogleService-Info.plist"
              if [ "${CONFIGURATION}" == "Release" ]; then
                SOURCE="${PROJECT_DIR}/FirebaseConfigs/GoogleService-Info-Prod.plist"
              else
                SOURCE="${PROJECT_DIR}/FirebaseConfigs/GoogleService-Info-Dev.plist"
              fi
              if [ ! -f "${SOURCE}" ]; then
                echo "error: Firebase config not found at ${SOURCE}"
                exit 1
              fi
              mkdir -p "$(dirname "${PLIST_DEST}")"
              cp "${SOURCE}" "${PLIST_DEST}"
            basedOnDependencyAnalysis: false
            showEnvVars: false
          - name: "Set build number and date"
            script: |
              echo "Setting build number and build date in Info.plist"

              PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"

              if [ ! -f "${PLIST}" ]; then
                echo "error: Info.plist not found at ${PLIST}"
                exit 1
              fi

              BUILD_NUMBER=$(date +"%Y%m%d%H%M")
              BUILD_DATE=$(date +"%Y-%m-%d %H:%M:%S")

              # Set CFBundleVersion (build number)
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "${PLIST}" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER}" "${PLIST}"

              # Custom key for build date
              /usr/libexec/PlistBuddy -c "Set :BuildDate \"${BUILD_DATE}\"" "${PLIST}" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :BuildDate string \"${BUILD_DATE}\"" "${PLIST}"

              echo "Build number: ${BUILD_NUMBER}"
              echo "Build date:   ${BUILD_DATE}"
            basedOnDependencyAnalysis: false
            showEnvVars: false
          - name: "Update Settings.bundle with build info"
            script: |
              echo "Updating Settings.bundle Root.plist with build info"

              PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
              SETTINGS_PLIST="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Settings.bundle/Root.plist"

              if [ ! -f "${PLIST}" ] || [ ! -f "${SETTINGS_PLIST}" ]; then
                echo "Info.plist or Settings Root.plist not found, skipping"
                exit 0
              fi

              BUILD_NUMBER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "${PLIST}")
              BUILD_DATE=$(/usr/libexec/PlistBuddy -c "Print :BuildDate" "${PLIST}")

              # Indices 0 and 1 are the first two elements in PreferenceSpecifiers.
              /usr/libexec/PlistBuddy -c "Set :PreferenceSpecifiers:0:DefaultValue ${BUILD_NUMBER}" "${SETTINGS_PLIST}"
              /usr/libexec/PlistBuddy -c "Set :PreferenceSpecifiers:1:DefaultValue ${BUILD_DATE}" "${SETTINGS_PLIST}"
            basedOnDependencyAnalysis: false
            showEnvVars: false
        settings:
            base:
                INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
                INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
                GENERATE_INFOPLIST_FILE: YES
                CLANG_CXX_LANGUAGE_STANDARD: gnu++20
                GCC_C_LANGUAGE_STANDARD: gnu17
                CURRENT_PROJECT_VERSION: 1.0
                MARKETING_VERSION: 1.0
                CODE_SIGN_ENTITLEMENTS: QuizApp/iOS/QuizApp-iOS.entitlements
                INFOPLIST_FILE: QuizApp/iOS/QuizApp-iOS-Info.plist
            configs:
                Debug-Mock:
                    SWIFT_ACTIVE_COMPILATION_CONDITIONS: MOCK_DATA $(inherited)
                    INFOPLIST_KEY_CFBundleDisplayName: QuizApp Mock
    QuizApp-macOS:
        type: application
        platform: macOS
        deploymentTarget: "15.7"
        sources:
          - path: QuizApp/macOS
          - path: QuizApp/Shared
          - path: QuizApp/Swiftgen+Generated
            createIntermediateGroups: true
        resources:
          - path: QuizApp/Shared/Resources
        dependencies:
            - package: SUICoordinator
            - package: Firebase
              products:
                - FirebaseCore
                - FirebaseAuth
            - package: GoogleSignIn
              products:
                - GoogleSignIn
                - GoogleSignInSwift
        preBuildScripts:
          - name: "Run Swiftgen script"
            script: |
              echo "Running a Swiftgen script!"
              if which swiftgen >/dev/null; then
                swiftgen
              else
                echo "warning: SwiftGen not found. Install with Homebrew or ensure it's in your PATH."
              fi
            basedOnDependencyAnalysis: false # Optional: Set to true if the script depends on build analysis
            showEnvVars: false # Optional: Set to true to show environment variables in the script's output
          - name: "Run SwiftLint script"
            script: |
                echo "Running a SwiftLint script!"
                if command -v swiftlint >/dev/null 2>&1; then
                    swiftlint
                else
                    echo "warning: swiftlint command not found - See https://github.com/realm/SwiftLint#installation for installation instructions."
                fi
            basedOnDependencyAnalysis: false # Optional: Set to true if the script depends on build analysis
            showEnvVars: false # Optional: Set to true to show environment variables in the script's output
        postBuildScripts:
          - name: "Run Firebase plist file script"
            script: |
              if [ "${CONFIGURATION}" == "Debug-Mock" ]; then
                echo "Skipping Firebase plist (MOCK_DATA)"
                exit 0
              fi
              echo "Running a Firebase plist script"
              PLIST_DEST="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Resources/GoogleService-Info.plist"
              rm -f "${TARGET_BUILD_DIR}/${WRAPPER_NAME}/GoogleService-Info.plist"
              if [ "${CONFIGURATION}" == "Release" ]; then
                SOURCE="${PROJECT_DIR}/FirebaseConfigs/macOS/GoogleService-Info-Prod.plist"
              else
                SOURCE="${PROJECT_DIR}/FirebaseConfigs/macOS/GoogleService-Info-Dev.plist"
              fi
              if [ ! -f "${SOURCE}" ]; then
                echo "error: Firebase config not found at ${SOURCE}"
                exit 1
              fi
              mkdir -p "$(dirname "${PLIST_DEST}")"
              cp "${SOURCE}" "${PLIST_DEST}"
            basedOnDependencyAnalysis: false
            showEnvVars: false
          - name: "Set build number and date"
            script: |
              echo "Setting build number and build date in Info.plist"

              PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"

              if [ ! -f "${PLIST}" ]; then
                echo "error: Info.plist not found at ${PLIST}"
                exit 1
              fi

              BUILD_NUMBER=$(date +"%Y%m%d%H%M")
              BUILD_DATE=$(date +"%Y-%m-%d %H:%M:%S")

              # Set CFBundleVersion (build number)
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "${PLIST}" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER}" "${PLIST}"

              # Custom key for build date
              /usr/libexec/PlistBuddy -c "Set :BuildDate \"${BUILD_DATE}\"" "${PLIST}" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Add :BuildDate string \"${BUILD_DATE}\"" "${PLIST}"

              echo "Build number: ${BUILD_NUMBER}"
              echo "Build date:   ${BUILD_DATE}"
            basedOnDependencyAnalysis: false
            showEnvVars: false
        settings:
            base:
                INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.education"
                GENERATE_INFOPLIST_FILE: YES
                CLANG_CXX_LANGUAGE_STANDARD: gnu++20
                GCC_C_LANGUAGE_STANDARD: gnu17
                CURRENT_PROJECT_VERSION: 1.0
                MARKETING_VERSION: 1.0
                CODE_SIGN_ENTITLEMENTS: QuizApp/macOS/QuizApp-macOS.entitlements
                PRODUCT_BUNDLE_IDENTIFIER: my.QuizApp-macOS
                CODE_SIGN_STYLE: Automatic
                DEVELOPMENT_TEAM: WG85DUNFDU
            configs:
                Debug-Mock:
                    SWIFT_ACTIVE_COMPILATION_CONDITIONS: MOCK_DATA $(inherited)
                    INFOPLIST_KEY_CFBundleDisplayName: QuizApp Mock
    QuizAppTests:
        type: bundle.unit-test
        platform: iOS
        deploymentTarget: "26.0"
        sources: [QuizAppTests]
        dependencies:
            - target: QuizApp-iOS
        settings:
            base:
                GENERATE_INFOPLIST_FILE: YES
                
    QuizAppUITests:
        type: bundle.ui-testing
        platform: iOS
        deploymentTarget: "16.0"
        sources: [QuizAppUITests]
        dependencies:
            - target: QuizApp-iOS
        
        settings:
            base:
                GENERATE_INFOPLIST_FILE: YES

schemes:
    QuizApp-iOS:
        build:
            targets:
                QuizApp-iOS: all
                QuizAppTests: all
                QuizAppUITests: all
        run:
            config: Debug
        test:
            config: Debug
            targets:
                - QuizAppTests
                - QuizAppUITests
    QuizApp-macOS:
        build:
            targets:
                QuizApp-macOS: all
        run:
            config: Debug
            commandLineArguments:
                "-resetLogin": false
    QuizApp-iOS-Mock:
        build:
            targets:
                QuizApp-iOS: all
                QuizAppTests: all
                QuizAppUITests: all
        run:
            config: Debug-Mock
        test:
            config: Debug-Mock
            targets:
                - QuizAppTests
                - QuizAppUITests
    QuizApp-macOS-Mock:
        build:
            targets:
                QuizApp-macOS: all
        run:
            config: Debug-Mock
            commandLineArguments:
                "-resetLogin": false

